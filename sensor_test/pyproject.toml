[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ld2410"
version = "0.1.0"
authors = [
  { name="Garv", email="garv@example.com" },
]
description = "A production-quality Python SDK for the Hi-Link HLK-LD2410C Human Presence Radar"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["ld2410*"]
